name: Python safety checks

on:
  push:
    branches: [main, codex/background-resume-audit]
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile core assistant modules
        run: |
          python -m py_compile             wowkids_cloud_agent.py             pair_windows_agent.py             class_controller.py             humanlike_engine.py             rating_engine.py             validate_context.py             wkcommon.py
